<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>单摆天体场景模拟器</title>
  <style>
    :root {
      --bg-1: #07111f;
      --bg-2: #101d30;
      --panel: rgba(12, 18, 32, 0.72);
      --panel-border: rgba(163, 205, 255, 0.25);
      --primary: #7ecbff;
      --secondary: #98f0d4;
      --text: #ebf7ff;
      --muted: #a6bdd9;
      --shadow: rgba(126, 203, 255, 0.30);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: radial-gradient(circle at 50% 18%, rgba(92, 130, 255, 0.20), transparent 28%), linear-gradient(180deg, var(--bg-1), var(--bg-2));
      color: var(--text);
    }

    body {
      position: relative;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: transparent;
      cursor: grab;
      user-select: none;
      touch-action: none;
    }

    canvas.dragging {
      cursor: grabbing;
    }

    .panel {
      position: absolute;
      left: 16px;
      top: 16px;
      width: min(360px, calc(100vw - 32px));
      padding: 14px 14px 12px;
      border: 1px solid var(--panel-border);
      border-radius: 20px;
      background: var(--panel);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 14px 38px rgba(0, 0, 0, 0.22), inset 0 0 0 1px rgba(255,255,255,0.03);
      z-index: 2;
    }

    .preset-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .preset {
      flex: 1 1 70px;
      min-width: 70px;
      border: 1px solid rgba(166, 189, 217, 0.28);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      border-radius: 999px;
      padding: 8px 10px;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
    }

    .preset:hover,
    .preset:active {
      transform: translateY(-1px);
    }

    .preset.active {
      border-color: rgba(126, 203, 255, 0.75);
      background: linear-gradient(135deg, rgba(126, 203, 255, 0.30), rgba(152, 240, 212, 0.20));
      box-shadow: 0 0 0 1px rgba(126, 203, 255, 0.35), 0 0 18px rgba(126, 203, 255, 0.18);
    }

    .control-group {
      margin-top: 10px;
    }

    .label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .value-pill {
      min-width: 60px;
      text-align: center;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(126, 203, 255, 0.10);
      border: 1px solid rgba(126, 203, 255, 0.25);
      color: var(--text);
      font-weight: 700;
      font-size: 0.75rem;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .footer-row {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    .action-btn {
      flex: 1 1 0;
      border: 1px solid rgba(166, 189, 217, 0.28);
      background: rgba(255,255,255,0.04);
      color: var(--text);
      border-radius: 12px;
      padding: 9px 12px;
      cursor: pointer;
      font-size: 0.78rem;
      font-weight: 700;
      transition: background 0.18s ease, transform 0.18s ease;
    }

    .action-btn:hover {
      background: rgba(255,255,255,0.08);
      transform: translateY(-1px);
    }

    @media (max-width: 768px) {
      .panel {
        top: 12px;
        left: 12px;
        right: 12px;
        width: auto;
        padding: 12px;
      }

      .preset {
        flex: 1 1 22%;
      }
    }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>

  <div class="panel" aria-label="单摆控制面板">
    <div class="preset-row">
      <button class="preset active" data-preset="earth">地球</button>
      <button class="preset" data-preset="moon">月球</button>
      <button class="preset" data-preset="jupiter">木星</button>
      <button class="preset" data-preset="space">太空</button>
    </div>

    <div class="control-group">
      <div class="label-row">
        <span>重力</span>
        <span class="value-pill" id="gravityValue">9.81</span>
      </div>
      <input id="gravity" type="range" min="0.1" max="30" step="0.1" value="9.81" />
    </div>

    <div class="control-group">
      <div class="label-row">
        <span>摆长</span>
        <span class="value-pill" id="lengthValue">190</span>
      </div>
      <input id="length" type="range" min="90" max="260" step="1" value="190" />
    </div>

    <div class="control-group">
      <div class="label-row">
        <span>阻尼</span>
        <span class="value-pill" id="dampingValue">0.996</span>
      </div>
      <input id="damping" type="range" min="0.90" max="0.999" step="0.001" value="0.996" />
    </div>

    <div class="control-group">
      <div class="label-row">
        <span>初始角度</span>
        <span class="value-pill" id="angleValue">0.70</span>
      </div>
      <input id="angle" type="range" min="0.1" max="1.5" step="0.01" value="0.70" />
    </div>

    <div class="footer-row">
      <button class="action-btn" id="resetBtn" type="button">重置</button>
      <button class="action-btn" id="randomBtn" type="button">随机</button>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "pendulum-scene-config-v1";
    const FACE_SET = ["🙂", "😄", "😎", "😌", "🤪", "😵", "😲", "😜"];

    const presets = {
      earth: { gravity: 9.81, length: 190, damping: 0.996, angle: 0.7 },
      moon: { gravity: 1.62, length: 170, damping: 0.992, angle: 0.9 },
      jupiter: { gravity: 24.79, length: 220, damping: 0.998, angle: 1.2 },
      space: { gravity: 0.8, length: 200, damping: 0.998, angle: 0.95 }
    };

    const ui = {
      gravity: document.getElementById("gravity"),
      length: document.getElementById("length"),
      damping: document.getElementById("damping"),
      angle: document.getElementById("angle"),
      gravityValue: document.getElementById("gravityValue"),
      lengthValue: document.getElementById("lengthValue"),
      dampingValue: document.getElementById("dampingValue"),
      angleValue: document.getElementById("angleValue"),
      resetBtn: document.getElementById("resetBtn"),
      randomBtn: document.getElementById("randomBtn"),
      presetButtons: [...document.querySelectorAll(".preset")]
    };

    const pendulum = {
      L: 190,
      g: 9.81,
      theta: 0.7,
      omega: 0,
      bobRadius: 24,
      damping: 0.996,
      trail: [],
      faceIndex: 0,
      lastTheta: 0.7
    };

    const state = {
      width: window.innerWidth,
      height: window.innerHeight,
      pivotX: 0,
      pivotY: 0,
      dragging: false,
      pointerId: null,
      lastTimestamp: 0,
      targetGravity: 9.81,
      activePreset: "earth"
    };

    const config = {
      gravity: 9.81,
      length: 190,
      damping: 0.996,
      angle: 0.7
    };

    function readConfig() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        if (!parsed || typeof parsed !== "object") return null;
        return parsed;
      } catch (error) {
        return null;
      }
    }

    function saveConfig() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(config));
      } catch (error) {
        // ignore localStorage failures
      }
    }

    function triggerFaceChange() {
      pendulum.faceIndex = (pendulum.faceIndex + 1) % FACE_SET.length;
    }

    function updateFaceBySwing() {
      const crossedZero = (pendulum.lastTheta > 0 && pendulum.theta <= 0) || (pendulum.lastTheta < 0 && pendulum.theta >= 0);
      if (crossedZero) {
        triggerFaceChange();
      }
      pendulum.lastTheta = pendulum.theta;
    }

    function applyConfigToUI() {
      ui.gravity.value = String(config.gravity);
      ui.length.value = String(config.length);
      ui.damping.value = String(config.damping);
      ui.angle.value = String(config.angle);

      ui.gravityValue.textContent = Number(config.gravity).toFixed(2);
      ui.lengthValue.textContent = String(Math.round(config.length));
      ui.dampingValue.textContent = Number(config.damping).toFixed(3);
      ui.angleValue.textContent = Number(config.angle).toFixed(2);
    }

    function syncToPhysics() {
      pendulum.L = config.length;
      pendulum.g = state.targetGravity;
      pendulum.damping = config.damping;
      pendulum.theta = config.angle;
      pendulum.omega = 0;
      pendulum.trail = [];
      pendulum.lastTheta = pendulum.theta;
      state.targetGravity = config.gravity;
    }

    function setPreset(name) {
      const preset = presets[name];
      if (!preset) return;

      state.activePreset = name;
      config.gravity = preset.gravity;
      config.length = preset.length;
      config.damping = preset.damping;
      config.angle = preset.angle;
      state.targetGravity = preset.gravity;

      applyConfigToUI();
      syncToPhysics();
      saveConfig();
      updatePresetButtons();
    }

    function updatePresetButtons() {
      ui.presetButtons.forEach((button) => {
        const active = button.dataset.preset === state.activePreset;
        button.classList.toggle("active", active);
      });
    }

    function applyCustomSettings() {
      config.gravity = Number(ui.gravity.value);
      config.length = Number(ui.length.value);
      config.damping = Number(ui.damping.value);
      config.angle = Number(ui.angle.value);

      ui.gravityValue.textContent = Number(config.gravity).toFixed(2);
      ui.lengthValue.textContent = String(Math.round(config.length));
      ui.dampingValue.textContent = Number(config.damping).toFixed(3);
      ui.angleValue.textContent = Number(config.angle).toFixed(2);

      state.activePreset = "custom";
      updatePresetButtons();
      state.targetGravity = config.gravity;
      pendulum.L = config.length;
      pendulum.damping = config.damping;
      pendulum.theta = config.angle;
      pendulum.omega = 0;
      saveConfig();
    }

    function randomize() {
      const minAngle = 0.25;
      const maxAngle = 1.4;
      const randomAngle = minAngle + Math.random() * (maxAngle - minAngle);
      config.angle = Number(randomAngle.toFixed(2));
      config.gravity = Number((Math.random() * 25 + 0.5).toFixed(2));
      config.length = Math.round(130 + Math.random() * 90);
      config.damping = Number((0.94 + Math.random() * 0.05).toFixed(3));

      state.activePreset = "custom";
      applyConfigToUI();
      state.targetGravity = config.gravity;
      pendulum.L = config.length;
      pendulum.damping = config.damping;
      pendulum.theta = config.angle;
      pendulum.omega = 0;
      saveConfig();
      updatePresetButtons();
    }

    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      state.width = window.innerWidth;
      state.height = window.innerHeight;
      canvas.width = Math.floor(state.width * dpr);
      canvas.height = Math.floor(state.height * dpr);
      canvas.style.width = state.width + "px";
      canvas.style.height = state.height + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      state.pivotX = state.width * 0.5;
      state.pivotY = state.height * 0.18;
    }

    function computeBobPosition() {
      return {
        x: state.pivotX + pendulum.L * Math.sin(pendulum.theta),
        y: state.pivotY + pendulum.L * Math.cos(pendulum.theta)
      };
    }

    function updatePhysics(dt) {
      pendulum.g += (state.targetGravity - pendulum.g) * 0.08;

      if (!state.dragging) {
        const alpha = -(pendulum.g / pendulum.L) * Math.sin(pendulum.theta);
        pendulum.omega += alpha * dt;
        pendulum.omega *= pendulum.damping;
        pendulum.theta += pendulum.omega * dt;
        updateFaceBySwing();
      }

      const bob = computeBobPosition();
      pendulum.trail.push({ x: bob.x, y: bob.y });
      if (pendulum.trail.length > 90) {
        pendulum.trail.shift();
      }
    }

    function drawBackground() {
      ctx.clearRect(0, 0, state.width, state.height);

      const gradient = ctx.createRadialGradient(
        state.width * 0.5,
        state.height * 0.2,
        20,
        state.width * 0.5,
        state.height * 0.6,
        state.height * 0.9
      );
      gradient.addColorStop(0, "rgba(88, 116, 255, 0.16)");
      gradient.addColorStop(0.45, "rgba(20, 33, 52, 0.10)");
      gradient.addColorStop(1, "rgba(7, 11, 18, 0.03)");

      ctx.fillStyle = "#091524";
      ctx.fillRect(0, 0, state.width, state.height);
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, state.width, state.height);
    }

    function drawTrail() {
      if (pendulum.trail.length < 2) return;

      ctx.save();
      for (let i = 1; i < pendulum.trail.length; i++) {
        const prev = pendulum.trail[i - 1];
        const cur = pendulum.trail[i];
        const alpha = (i / pendulum.trail.length) * 0.9;
        const hue = 190 + (i / pendulum.trail.length) * 120;
        ctx.beginPath();
        ctx.moveTo(prev.x, prev.y);
        ctx.lineTo(cur.x, cur.y);
        ctx.strokeStyle = `hsla(${hue}, 90%, 68%, ${alpha})`;
        ctx.lineWidth = 2.4;
        ctx.shadowColor = `hsla(${hue}, 95%, 70%, 0.7)`;
        ctx.shadowBlur = 16;
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawPendulum() {
      const bob = computeBobPosition();

      ctx.save();

      ctx.beginPath();
      ctx.moveTo(state.pivotX, state.pivotY);
      ctx.lineTo(bob.x, bob.y);
      ctx.strokeStyle = "rgba(207, 228, 255, 0.95)";
      ctx.lineWidth = 3;
      ctx.shadowColor = "rgba(140, 197, 255, 0.8)";
      ctx.shadowBlur = 18;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(state.pivotX, state.pivotY, 8, 0, Math.PI * 2);
      ctx.fillStyle = "#f0f8ff";
      ctx.shadowColor = "rgba(255,255,255,0.75)";
      ctx.shadowBlur = 18;
      ctx.fill();

      const glow = ctx.createRadialGradient(bob.x - 10, bob.y - 10, 4, bob.x, bob.y, pendulum.bobRadius + 24);
      glow.addColorStop(0, "rgba(255,255,255,1)");
      glow.addColorStop(0.18, "rgba(154, 223, 255, 0.95)");
      glow.addColorStop(0.65, "rgba(88, 137, 255, 0.70)");
      glow.addColorStop(1, "rgba(38, 54, 107, 0.85)");

      ctx.beginPath();
      ctx.arc(bob.x, bob.y, pendulum.bobRadius, 0, Math.PI * 2);
      ctx.fillStyle = glow;
      ctx.shadowColor = "rgba(126, 203, 255, 0.95)";
      ctx.shadowBlur = 24;
      ctx.fill();

      ctx.font = '42px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.shadowBlur = 0;
      ctx.fillText(FACE_SET[pendulum.faceIndex], bob.x, bob.y + 3);

      ctx.restore();
    }

    function pointerToCanvas(event) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: event.clientX - rect.left,
        y: event.clientY - rect.top
      };
    }

    function hitTest(point) {
      const bob = computeBobPosition();
      const distance = Math.hypot(point.x - bob.x, point.y - bob.y);
      return distance <= pendulum.bobRadius + 14 ? true : false;
    }

    function onPointerDown(event) {
      const point = pointerToCanvas(event);
      if (!hitTest(point)) return;

      state.dragging = true;
      state.pointerId = event.pointerId;
      canvas.classList.add("dragging");
      pendulum.theta = Math.atan2(point.x - state.pivotX, point.y - state.pivotY);
      pendulum.omega = 0;
      triggerFaceChange();
    }

    function onPointerMove(event) {
      if (!state.dragging || event.pointerId !== state.pointerId) return;
      const point = pointerToCanvas(event);
      pendulum.theta = Math.atan2(point.x - state.pivotX, point.y - state.pivotY);
      pendulum.omega = 0;
      config.angle = Number(pendulum.theta.toFixed(2));
      ui.angle.value = String(config.angle);
      ui.angleValue.textContent = Number(config.angle).toFixed(2);
      state.activePreset = "custom";
      updatePresetButtons();
      saveConfig();
      triggerFaceChange();
    }

    function onPointerUp(event) {
      if (event.pointerId !== state.pointerId) return;
      state.dragging = false;
      state.pointerId = null;
      canvas.classList.remove("dragging");
      config.angle = Number(pendulum.theta.toFixed(2));
      ui.angle.value = String(config.angle);
      ui.angleValue.textContent = Number(config.angle).toFixed(2);
      saveConfig();
      triggerFaceChange();
    }

    function animate(timestamp) {
      if (!state.lastTimestamp) state.lastTimestamp = timestamp;
      const dt = Math.min((timestamp - state.lastTimestamp) / 1000, 0.03);
      state.lastTimestamp = timestamp;

      updatePhysics(dt);
      drawBackground();
      drawTrail();
      drawPendulum();

      requestAnimationFrame(animate);
    }

    const canvas = document.getElementById("scene");
    const ctx = canvas.getContext("2d");

    ui.gravity.addEventListener("input", () => {
      applyCustomSettings();
    });

    ui.length.addEventListener("input", () => {
      applyCustomSettings();
    });

    ui.damping.addEventListener("input", () => {
      applyCustomSettings();
    });

    ui.angle.addEventListener("input", () => {
      applyCustomSettings();
    });

    ui.resetBtn.addEventListener("click", () => {
      const saved = readConfig();
      const fallback = { gravity: 9.81, length: 190, damping: 0.996, angle: 0.7 };
      const target = saved || fallback;
      config.gravity = Number(target.gravity);
      config.length = Number(target.length);
      config.damping = Number(target.damping);
      config.angle = Number(target.angle);
      state.targetGravity = config.gravity;
      state.activePreset = "custom";
      applyConfigToUI();
      syncToPhysics();
      saveConfig();
      updatePresetButtons();
    });

    ui.randomBtn.addEventListener("click", () => {
      randomize();
    });

    ui.presetButtons.forEach((button) => {
      button.addEventListener("click", () => {
        setPreset(button.dataset.preset);
      });
    });

    canvas.addEventListener("pointerdown", onPointerDown);
    canvas.addEventListener("pointermove", onPointerMove);
    canvas.addEventListener("pointerup", onPointerUp);
    canvas.addEventListener("pointerleave", onPointerUp);
    canvas.addEventListener("pointercancel", onPointerUp);

    window.addEventListener("resize", resizeCanvas, { passive: true });

    const storedConfig = readConfig();
    if (storedConfig) {
      config.gravity = Number(storedConfig.gravity ?? 9.81);
      config.length = Number(storedConfig.length ?? 190);
      config.damping = Number(storedConfig.damping ?? 0.996);
      config.angle = Number(storedConfig.angle ?? 0.7);
      state.targetGravity = config.gravity;
      state.activePreset = "custom";
    }

    applyConfigToUI();
    syncToPhysics();
    updatePresetButtons();
    resizeCanvas();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
