<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>双摆混沌物理模拟器</title>
  <style>
    :root {
      --bg-1: #0a0d18;
      --bg-2: #121a2d;
      --panel: rgba(18, 24, 36, 0.58);
      --line: rgba(180, 220, 255, 0.9);
      --text: #eaf5ff;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at 50% 15%, rgba(110, 144, 255, 0.18), transparent 28%),
        linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 100%);
      color: var(--text);
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: grab;
      touch-action: none;
      user-select: none;
    }

    canvas.dragging {
      cursor: grabbing;
    }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>

  <script>
    const canvas = document.getElementById("scene");
    const ctx = canvas.getContext("2d");

    const pendulum = {
      g: 9.8,
      l1: 170,
      l2: 150,
      m1: 1.0,
      m2: 1.4,
      theta1: Math.PI / 2.3,
      theta2: 0.6,
      omega1: 0.0,
      omega2: 0.0,
      bobRadius: 15,
      damping: 0.9998,
      trail: []
    };

    const state = {
      width: window.innerWidth,
      height: window.innerHeight,
      pivotX: 0,
      pivotY: 0,
      dragging: false,
      dragPointerId: null,
      dragTarget: null,
      lastPointerX: 0,
      lastPointerY: 0,
      lastTimestamp: 0,
      lastDragTheta1: pendulum.theta1,
      lastDragTheta2: pendulum.theta2,
      lastDragTime: 0
    };

    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      state.width = window.innerWidth;
      state.height = window.innerHeight;
      canvas.width = Math.floor(state.width * dpr);
      canvas.height = Math.floor(state.height * dpr);
      canvas.style.width = state.width + "px";
      canvas.style.height = state.height + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      state.pivotX = state.width * 0.5;
      state.pivotY = state.height * 0.18;
    }

    function getPendulumPositions() {
      const x1 = pendulum.l1 * Math.sin(pendulum.theta1);
      const y1 = pendulum.l1 * Math.cos(pendulum.theta1);
      const x2 = x1 + pendulum.l2 * Math.sin(pendulum.theta2);
      const y2 = y1 + pendulum.l2 * Math.cos(pendulum.theta2);

      return {
        bob1: { x: state.pivotX + x1, y: state.pivotY + y1 },
        bob2: { x: state.pivotX + x2, y: state.pivotY + y2 }
      };
    }

    function computeAccelerations(theta1, theta2, omega1, omega2) {
      const m1 = pendulum.m1;
      const m2 = pendulum.m2;
      const g = pendulum.g;
      const l1 = pendulum.l1;
      const l2 = pendulum.l2;
      const delta = theta1 - theta2;
      const denom = 2 * m1 + m2 - m2 * Math.cos(2 * delta);

      const alpha1 = (
        -g * (2 * m1 + m2) * Math.sin(theta1)
        - m2 * g * Math.sin(theta1 - 2 * theta2)
        - 2 * Math.sin(delta) * m2 * (omega2 * omega2 * l2 + omega1 * omega1 * l1 * Math.cos(delta))
      ) / (l1 * denom);

      const alpha2 = (
        2 * Math.sin(delta) * (
          omega1 * omega1 * l1 * (m1 + m2)
          + g * (m1 + m2) * Math.cos(theta1)
          + omega2 * omega2 * l2 * m2 * Math.cos(delta)
        )
      ) / (l2 * denom);

      return { alpha1, alpha2 };
    }

    function rk4Step(dt) {
      const s0 = {
        theta1: pendulum.theta1,
        theta2: pendulum.theta2,
        omega1: pendulum.omega1,
        omega2: pendulum.omega2
      };

      const deriv = (stateVar) => {
        const acc = computeAccelerations(stateVar.theta1, stateVar.theta2, stateVar.omega1, stateVar.omega2);
        return {
          theta1: stateVar.omega1,
          theta2: stateVar.omega2,
          omega1: acc.alpha1,
          omega2: acc.alpha2
        };
      };

      const k1 = deriv(s0);
      const s1 = {
        theta1: s0.theta1 + k1.theta1 * dt * 0.5,
        theta2: s0.theta2 + k1.theta2 * dt * 0.5,
        omega1: s0.omega1 + k1.omega1 * dt * 0.5,
        omega2: s0.omega2 + k1.omega2 * dt * 0.5
      };
      const k2 = deriv(s1);

      const s2 = {
        theta1: s0.theta1 + k2.theta1 * dt * 0.5,
        theta2: s0.theta2 + k2.theta2 * dt * 0.5,
        omega1: s0.omega1 + k2.omega1 * dt * 0.5,
        omega2: s0.omega2 + k2.omega2 * dt * 0.5
      };
      const k3 = deriv(s2);

      const s3 = {
        theta1: s0.theta1 + k3.theta1 * dt,
        theta2: s0.theta2 + k3.theta2 * dt,
        omega1: s0.omega1 + k3.omega1 * dt,
        omega2: s0.omega2 + k3.omega2 * dt
      };
      const k4 = deriv(s3);

      const next = {
        theta1: s0.theta1 + (dt / 6) * (k1.theta1 + 2 * k2.theta1 + 2 * k3.theta1 + k4.theta1),
        theta2: s0.theta2 + (dt / 6) * (k1.theta2 + 2 * k2.theta2 + 2 * k3.theta2 + k4.theta2),
        omega1: s0.omega1 + (dt / 6) * (k1.omega1 + 2 * k2.omega1 + 2 * k3.omega1 + k4.omega1),
        omega2: s0.omega2 + (dt / 6) * (k1.omega2 + 2 * k2.omega2 + 2 * k3.omega2 + k4.omega2)
      };

      return next;
    }

    function updatePhysics(dt) {
      if (state.dragging) return;

      const next = rk4Step(dt);

      if (Number.isFinite(next.theta1) && Number.isFinite(next.theta2) && Number.isFinite(next.omega1) && Number.isFinite(next.omega2)) {
        pendulum.theta1 = next.theta1;
        pendulum.theta2 = next.theta2;
        pendulum.omega1 = next.omega1 * pendulum.damping;
        pendulum.omega2 = next.omega2 * pendulum.damping;
      }

      const pos = getPendulumPositions();
      pendulum.trail.push({ x: pos.bob2.x, y: pos.bob2.y });
      if (pendulum.trail.length > 70) {
        pendulum.trail.shift();
      }
    }

    function drawBackground() {
      ctx.clearRect(0, 0, state.width, state.height);

      const gradient = ctx.createRadialGradient(
        state.width * 0.5,
        state.height * 0.2,
        30,
        state.width * 0.5,
        state.height * 0.5,
        state.height * 0.8
      );
      gradient.addColorStop(0, "rgba(97, 123, 255, 0.14)");
      gradient.addColorStop(0.4, "rgba(38, 56, 82, 0.14)");
      gradient.addColorStop(1, "rgba(8, 10, 18, 0.02)");

      ctx.fillStyle = "#0d1320";
      ctx.fillRect(0, 0, state.width, state.height);
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, state.width, state.height);
    }

    function drawTrail() {
      if (pendulum.trail.length < 2) return;

      ctx.save();
      for (let i = 1; i < pendulum.trail.length; i++) {
        const prev = pendulum.trail[i - 1];
        const cur = pendulum.trail[i];
        const alpha = (i / pendulum.trail.length) * 0.9;
        const hue = 190 + (i / pendulum.trail.length) * 150;

        ctx.beginPath();
        ctx.moveTo(prev.x, prev.y);
        ctx.lineTo(cur.x, cur.y);
        ctx.strokeStyle = `hsla(${hue}, 95%, 65%, ${alpha})`;
        ctx.lineWidth = 2.2;
        ctx.shadowBlur = 16;
        ctx.shadowColor = `hsla(${hue}, 100%, 70%, 0.8)`;
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawDoublePendulum() {
      const p1 = getPendulumPositions();
      const bob1 = p1.bob1;
      const bob2 = p1.bob2;

      ctx.save();

      ctx.beginPath();
      ctx.moveTo(state.pivotX, state.pivotY);
      ctx.lineTo(bob1.x, bob1.y);
      ctx.lineTo(bob2.x, bob2.y);
      ctx.strokeStyle = "rgba(218, 236, 255, 0.92)";
      ctx.lineWidth = 3;
      ctx.shadowColor = "rgba(148, 197, 255, 0.7)";
      ctx.shadowBlur = 16;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(state.pivotX, state.pivotY, 8, 0, Math.PI * 2);
      ctx.fillStyle = "#f9fdff";
      ctx.shadowColor = "rgba(255,255,255,0.9)";
      ctx.shadowBlur = 18;
      ctx.fill();

      const bob1Gradient = ctx.createRadialGradient(
        bob1.x - 8,
        bob1.y - 8,
        4,
        bob1.x,
        bob1.y,
        pendulum.bobRadius + 18
      );
      bob1Gradient.addColorStop(0, "rgba(255,255,255,1)");
      bob1Gradient.addColorStop(0.2, "rgba(188,220,255,0.95)");
      bob1Gradient.addColorStop(0.7, "rgba(84,149,255,0.7)");
      bob1Gradient.addColorStop(1, "rgba(50,72,125,0.8)");

      ctx.beginPath();
      ctx.arc(bob1.x, bob1.y, pendulum.bobRadius, 0, Math.PI * 2);
      ctx.fillStyle = bob1Gradient;
      ctx.shadowColor = "rgba(100,180,255,0.9)";
      ctx.shadowBlur = 24;
      ctx.fill();

      const bob2Gradient = ctx.createRadialGradient(
        bob2.x - 10,
        bob2.y - 10,
        6,
        bob2.x,
        bob2.y,
        pendulum.bobRadius + 24
      );
      bob2Gradient.addColorStop(0, "rgba(255,255,255,0.98)");
      bob2Gradient.addColorStop(0.15, "rgba(255,170,210,0.95)");
      bob2Gradient.addColorStop(0.5, "rgba(117,236,255,0.8)");
      bob2Gradient.addColorStop(0.75, "rgba(154,124,255,0.75)");
      bob2Gradient.addColorStop(1, "rgba(52, 86, 128, 0.9)");

      ctx.beginPath();
      ctx.arc(bob2.x, bob2.y, pendulum.bobRadius + 4, 0, Math.PI * 2);
      ctx.fillStyle = bob2Gradient;
      ctx.shadowColor = "rgba(96,220,255,0.9)";
      ctx.shadowBlur = 28;
      ctx.fill();

      ctx.restore();
    }

    function pointerToCanvas(event) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: event.clientX - rect.left,
        y: event.clientY - rect.top
      };
    }

    function hitTest(point) {
      const positions = getPendulumPositions();
      const bob1Dist = Math.hypot(point.x - positions.bob1.x, point.y - positions.bob1.y);
      const bob2Dist = Math.hypot(point.x - positions.bob2.x, point.y - positions.bob2.y);

      if (bob1Dist <= pendulum.bobRadius + 18) return "bob1";
      if (bob2Dist <= pendulum.bobRadius + 18) return "bob2";
      return null;
    }

    function setDragStateFromPointer(point, target) {
      if (target === "bob1") {
        const targetAngle = Math.atan2(point.x - state.pivotX, point.y - state.pivotY);
        pendulum.theta1 = targetAngle;
        pendulum.omega1 = 0;
      } else if (target === "bob2") {
        const pos1 = getPendulumPositions().bob1;
        const dx = point.x - pos1.x;
        const dy = point.y - pos1.y;
        pendulum.theta2 = Math.atan2(dx, dy);
        pendulum.omega2 = 0;
      }
    }

    function onPointerDown(event) {
      const point = pointerToCanvas(event);
      const target = hitTest(point);
      if (!target) return;

      state.dragging = true;
      state.dragPointerId = event.pointerId;
      state.dragTarget = target;
      canvas.classList.add("dragging");

      state.lastPointerX = point.x;
      state.lastPointerY = point.y;
      state.lastDragTheta1 = pendulum.theta1;
      state.lastDragTheta2 = pendulum.theta2;
      state.lastDragTime = performance.now();

      setDragStateFromPointer(point, target);
    }

    function onPointerMove(event) {
      if (!state.dragging || event.pointerId !== state.dragPointerId) return;

      const point = pointerToCanvas(event);
      const now = performance.now();
      const dt = Math.max((now - state.lastDragTime) / 1000, 0.016);

      if (state.dragTarget === "bob1") {
        const theta = Math.atan2(point.x - state.pivotX, point.y - state.pivotY);
        const dTheta = theta - state.lastDragTheta1;
        pendulum.theta1 = theta;
        pendulum.omega1 = dTheta / dt;
        state.lastDragTheta1 = theta;
      } else if (state.dragTarget === "bob2") {
        const pos1 = getPendulumPositions().bob1;
        const dx = point.x - pos1.x;
        const dy = point.y - pos1.y;
        const theta = Math.atan2(dx, dy);
        const dTheta = theta - state.lastDragTheta2;
        pendulum.theta2 = theta;
        pendulum.omega2 = dTheta / dt;
        state.lastDragTheta2 = theta;
      }

      state.lastPointerX = point.x;
      state.lastPointerY = point.y;
      state.lastDragTime = now;
    }

    function onPointerUp(event) {
      if (event.pointerId !== state.dragPointerId) return;
      state.dragging = false;
      state.dragPointerId = null;
      state.dragTarget = null;
      canvas.classList.remove("dragging");
    }

    function animate(timestamp) {
      if (!state.lastTimestamp) {
        state.lastTimestamp = timestamp;
      }

      const dt = Math.min((timestamp - state.lastTimestamp) / 1000, 0.03);
      state.lastTimestamp = timestamp;

      updatePhysics(dt);
      drawBackground();
      drawTrail();
      drawDoublePendulum();

      requestAnimationFrame(animate);
    }

    canvas.addEventListener("pointerdown", onPointerDown);
    canvas.addEventListener("pointermove", onPointerMove);
    canvas.addEventListener("pointerup", onPointerUp);
    canvas.addEventListener("pointerleave", onPointerUp);
    canvas.addEventListener("pointercancel", onPointerUp);
    window.addEventListener("resize", resizeCanvas, { passive: true });

    resizeCanvas();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
